spring.application.name=picture-of-the-day
# Tạo sẵn Database 'nasa_db' trong MySQL Workbench / phpMyAdmin trước khi chạy
spring.datasource.url=jdbc:mysql://localhost:3306/nasa_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Cấu hình Hibernate tự động tạo/cập nhật bảng trong DB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true